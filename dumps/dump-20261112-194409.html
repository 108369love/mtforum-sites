        (function () {
            var docEl = document.documentElement;
            if (!docEl.classList.contains('yh-theme-system') || !window.matchMedia) {
                return;
            }

            var systemThemeMedia = window.matchMedia('(prefers-color-scheme: dark)');
            var syncSystemTheme = function () {
                docEl.classList.toggle('yh-theme-dark', systemThemeMedia.matches);
            };

            syncSystemTheme();
            if (systemThemeMedia.addEventListener) {

            } else if (systemThemeMedia.addListener) {
                systemThemeMedia.addListener(syncSystemTheme);
            }
        })();

<body class="pb-16" style="--bbs-global-top-height: 0px;">
    <div class="main-container">
        
        <script src="/NetCSS/JS/Shared/MessageAction.js"></script>
        <script>
            (function() {
                var globalTop = document.querySelector('.bbs-global-top');
                if (!globalTop) return;

                var newMessage = globalTop.querySelector('.newMessage');
                if (newMessage) {
                    var text = newMessage.textContent || '';
                    // 正则提取所有数字：例如 收到2封飞鸽传书 提取为 2
                    var match = text.match(/收到\s*(\d+)\s*封/) || text.match(/\((\d+)\)/) || text.match(/(\d+)/);
                    var count = match ? parseInt(match[1], 10) : 0;

                    // 获取查看消息列表的 URL：如果没有匹配到含有 messagelist 的链接，则使用默认的 /bbs/messagelist.aspx
                    var viewLink = newMessage.querySelector('a[href*="messagelist"]');
                    var viewLinkHref = viewLink ? viewLink.getAttribute('href') : '/bbs/messagelist.aspx?siteid=1000';

                    if (count > 0) {
                        var clearLinkHref = '/bbs/messagelist_clear.aspx?action=delall&issystem=3';

                        // 重构内部 HTML，使其符合 W3C 规范，杜绝 a 标签嵌套，彻底剔除 clean.png 和多余的脚本文件
                        newMessage.innerHTML = '您有 <span class="msg-count" style="font-weight:600;color:#378d8d;">' + count + '</span> 条新飞鸽传书，' +
                            '<a href="' + viewLinkHref + '" class="msg-view-btn">立即查看</a>' +
                            '<a href="' + clearLinkHref + '" class="msg-clear-btn">我知道了</a>';

                        var clearBtn = newMessage.querySelector('.msg-clear-btn');
                        if (clearBtn) {
                            clearBtn.addEventListener('click', function(e) {
                                e.preventDefault();
                                hideGlobalTop();
                                if (window.YhMessageAction) {
                                    YhMessageAction.post('/bbs/messagelist_clear.aspx', { action: 'godelall', types: '0', issystem: '3' })
                                        .catch(function() {
                                            // 仅隐藏当前提示；如果服务端未清除，刷新后仍会按未读消息重新显示。
                                        });
                                }
                            });
                        }

                        newMessage.style.display = 'block';
                    } else {
                        hideGlobalTop();
                    }
                }

                function hideGlobalTop() {
                    document.body.style.setProperty('--bbs-global-top-height', '0px');
                    document.body.classList.remove('has-global-top');

                    if (globalTop.parentNode) {
                        globalTop.parentNode.removeChild(globalTop);
                    }
                }

                function syncGlobalTopHeight() {
                    if (!document.body.contains(globalTop)) {
                        document.body.style.setProperty('--bbs-global-top-height', '0px');
                        document.body.classList.remove('has-global-top');
                        return;
                    }

                    var visibleMsg = globalTop.querySelector('.newMessage');
                    if (visibleMsg && window.getComputedStyle(visibleMsg).display !== 'none') {
                        document.body.style.setProperty('--bbs-global-top-height', globalTop.offsetHeight + 'px');
                    } else {
                        document.body.style.setProperty('--bbs-global-top-height', '0px');
                        document.body.classList.remove('has-global-top');
                    }
                }

                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', syncGlobalTopHeight);
                } else {
                    syncGlobalTopHeight();
                }

                window.addEventListener('resize', syncGlobalTopHeight);

                if (window.MutationObserver) {
                    var observer = new MutationObserver(function() {
                        syncGlobalTopHeight();
                    });
                    observer.observe(globalTop, { childList: true, subtree: true });
                }
            })();
        </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchType = document.getElementById('searchType');
            const searchOptions = document.getElementById('searchOptions');
            const currentSearchType = document.getElementById('currentSearchType');
            const optionItems = document.querySelectorAll('#searchOptions div');
            const searchInput = document.getElementById('searchInput');
            const form = document.getElementById('scbar_form');

            // 选项切换
            searchType.addEventListener('click', function(event) {
                event.stopPropagation();
                searchOptions.classList.toggle('active');
                searchType.classList.toggle('active'); // 控制三角翻转
            });
            optionItems.forEach(item => {
                item.addEventListener('click', function() {
                    currentSearchType.textContent = this.getAttribute('data-type');
                    searchOptions.classList.remove('active');
                    searchType.classList.remove('active'); // 选项确定后恢复
                });
            });
            // 输入框聚焦时关闭下拉菜单
            searchInput.addEventListener('focus', function() {
                searchOptions.classList.remove('active');
                searchType.classList.remove('active'); // 输入框聚焦时恢复
            });
            // 点击其他地方关闭下拉菜单
            document.addEventListener('click', function(event) {
                if (!searchType.contains(event.target) && !searchOptions.contains(event.target)) {
                    searchOptions.classList.remove('active');
                    searchType.classList.remove('active'); // 点击其他地方恢复
                }
            });
            // 表单提交逻辑
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const type = currentSearchType.textContent;
                const key = searchInput.value.trim();
                let url = '';
                if (!key) return;
                if (type === '标题') {
                    url = '/bbs/book_list_search.aspx?action=search&siteid=1000&classid=0&type=title&key=' + encodeURIComponent(key);
                } else if (type === '内容') {
                    url = '/bbs/book_list_search.aspx?action=search&siteid=1000&classid=0&type=content&key=' + encodeURIComponent(key);
                } else if (type === '昵称') {
                    url = '/bbs/usersearch.aspx?key=' + encodeURIComponent(key);
                } else if (type === 'ID号') {
                    url = '/bbs/usersearch.aspx?touserid=' + encodeURIComponent(key);
                }
                window.location.href = url;
            });
        });
    </script>
